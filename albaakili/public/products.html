<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنتجات — البعقيلي للحجاب</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header id="header">
  <div class="container header-inner">
    <a href="/" class="logo">
      <img src="/assets/logo.png" alt="البعقيلي" onerror="this.style.display='none'">
      <div class="logo-text">
        <span class="logo-text-main">البعقيلي للحجاب</span>
        <span class="logo-text-sub">Luxury Modest Fashion</span>
      </div>
    </a>
    <nav><ul>
      <li><a href="/">الرئيسية</a></li>
      <li><a href="/products" class="active">المنتجات</a></li>
      <li><a href="/offers">العروض</a></li>
      <li><a href="/about">من نحن</a></li>
      <li><a href="/contact">تواصلي معنا</a></li>
    </ul></nav>
    <div class="header-actions">
      <button id="themeToggle" class="icon-btn"><i class="fas fa-moon"></i></button>
      <a href="#" class="btn btn-whatsapp btn-sm header-whatsapp"><i class="fab fa-whatsapp"></i> واتساب</a>
      <button id="hamburger" class="hamburger"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>
<div id="mobileMenu" class="mobile-menu">
  <nav><ul>
    <li><a href="/">الرئيسية</a></li>
    <li><a href="/products">المنتجات</a></li>
    <li><a href="/offers">العروض</a></li>
    <li><a href="/about">من نحن</a></li>
    <li><a href="/contact">تواصلي معنا</a></li>
  </ul></nav>
</div>

<div class="page-hero">
  <div class="container">
    <h1>تشكيلة <span style="color:var(--gold)">المنتجات</span></h1>
    <div class="breadcrumb"><a href="/">الرئيسية</a> <i class="fas fa-chevron-left" style="font-size:.7rem"></i> المنتجات</div>
  </div>
</div>

<section>
  <div class="container">
    <!-- Filters -->
    <div class="filters-bar">
      <div class="search-bar" style="flex:1;max-width:350px">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="ابحثي عن منتج...">
      </div>
      <div class="filter-group">
        <label>التصنيف</label>
        <select id="categoryFilter" class="filter-select"></select>
      </div>
      <div class="filter-group">
        <label>السعر من</label>
        <input type="number" id="priceMin" class="filter-input" style="width:90px" placeholder="0">
      </div>
      <div class="filter-group">
        <label>إلى</label>
        <input type="number" id="priceMax" class="filter-input" style="width:90px" placeholder="∞">
      </div>
      <div class="filter-group">
        <label>الترتيب</label>
        <select id="sortSelect" class="filter-select">
          <option value="newest">الأحدث</option>
          <option value="price-asc">السعر: الأقل</option>
          <option value="price-desc">السعر: الأعلى</option>
          <option value="name">الاسم</option>
        </select>
      </div>
    </div>

    <div class="filter-chips">
      <div class="filter-chip active" data-filter="all">الكل</div>
      <div class="filter-chip" data-filter="featured">المميزة ✨</div>
      <div class="filter-chip" data-filter="available">المتوفرة</div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <span style="font-size:.85rem;color:var(--text-muted)">النتائج: <strong id="resultsCount">0</strong></span>
    </div>

    <div class="products-grid" id="productsGrid">
      <div class="loading"><div class="spinner"></div> جاري التحميل...</div>
    </div>

    <div class="pagination" id="pagination"></div>
  </div>
</section>

<div class="whatsapp-float">
  <div class="whatsapp-pulse"></div>
  <a href="#" id="whatsappFloat" class="whatsapp-btn header-whatsapp" target="_blank" rel="noopener">
    <i class="fab fa-whatsapp"></i>
  </a>
</div>
<button id="scrollTop" class="scroll-top"><i class="fas fa-chevron-up"></i></button>

<footer class="footer" style="padding:30px 0">
  <div class="footer-bottom">
    <div class="container" style="display:flex;justify-content:space-between">
      <span>© 2024 البعقيلي للحجاب</span>
      <a href="/" style="color:var(--gold-light)">العودة للرئيسية</a>
    </div>
  </div>
</footer>

<script src="/js/main.js"></script>
<script src="/js/products.js"></script>
</body>
</html>
